name: Release

# 打一个 `v*` 标签（如 v0.1.0）→ 自动构建单文件 exe → 自检 → 发布到 GitHub Releases。
# 也可以在 Actions 页面手动触发（只产出 artifact，不建 Release）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 exe
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      EXE_NAME: EVE-Voice-Translator.exe

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: 安装依赖
        run: pip install -r requirements-build.txt

      # ---------- 构建（与 build_exe.bat 完全一致的步骤）----------

      - name: 生成应用图标
        run: python -m src.tools.make_app_icon

      - name: 打包单文件 exe
        run: python -m PyInstaller --noconfirm --clean trans.spec

      # ---------- 产物自检 ----------

      # 硬门禁：密钥泄漏 / 内置资源 / 体积。确定性检查，不依赖 GUI。
      - name: 产物自检（密钥、内置资源、体积）
        run: python -m src.tools.verify_bundle "dist/${{ env.EXE_NAME }}"

      # 硬门禁：真跑一遍 exe（A~F 六阶段，含窗口模式 / 重启自身 / 设置窗口）。
      # 已在 v0.1.0 的 CI 运行中实测通过（windows-latest 有桌面会话，Qt 托盘正常），
      # 所以直接当门禁 —— 产物跑不起来就不该发布。
      - name: 冒烟测试（真跑 exe）
        run: python -m src.tools.smoke_test_exe "dist/${{ env.EXE_NAME }}"

      - name: 计算 SHA256
        shell: bash
        run: |
          cd dist
          sha256sum "$EXE_NAME" > "$EXE_NAME.sha256"
          cat "$EXE_NAME.sha256"

      - name: 上传构建产物（Actions 页面可下载）
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Voice-Translator-windows-x64
          path: |
            dist/${{ env.EXE_NAME }}
            dist/${{ env.EXE_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

      # ---------- 发布到 Releases ----------

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          ASSETS=("dist/$EXE_NAME" "dist/$EXE_NAME.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TAG" \
              --generate-notes
          fi
          echo "已发布: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
